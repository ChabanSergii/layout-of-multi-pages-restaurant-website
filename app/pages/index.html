        <title>Gericht | Home-Restaurant</title>
        <link rel="stylesheet" href="./../css/normalize.css">
        <link rel="stylesheet" href="./../css/swiper-bundle.min.css">
        <link rel="stylesheet" href="./../css/main.min.css">
    </head>
    <body>
        <div class="wrapper">
            <!--= include header.html -->
            <main class="main">
                <!--= include restaurant-hero.html -->
                <!--= include restaurant-about.html -->
                <!--= include reservation-form.html -->
                <!--= include menu.html -->
                <!--= include menu-special.html -->
                <!--= include restaurant-chef.html -->
                <!--= include restaurant-testimony.html -->
                <!--= include restaurant-preview.html -->
                <!--= include awards.html -->
                <!--= include restaurant-blog.html -->
                <!--= include instagram.html -->
                <!--= include subscribe.html -->
                <!--= include scrollTop.html -->
            </main>
            <!--= include footer.html -->
        </div>

        <script src="./../js/index.bundle.js"></script>
        <script src="./../js/swiper-bundle.min.js"></script>
        <script src="./../js/custom_select.bundle.js"></script>
        <script src="./../js/video_player.bundle.js"></script>
        <script src="./../js/view_more.bundle.js"></script>
        <script src="./../js/form_validation.bundle.js"></script>

        <!-- TODO перенести скрипты в отдельный файл -->
        <!-- TODO перенастроить нормалайзы -->
        <!-- FIXME: поправить кнопку play/pause/ улучшить семантику блока под несколько форматов, добавить атрибутов -->

        <!-- Swiper Hero -->
        <script>
            var swiper = new Swiper(".swiper__restaurant-hero", {
              loop: true,
              pagination: {
                  el: ".swiper-pagination",
                  type: "fraction",
              },
            });
        </script>

        <!-- Swiper Menu -->
        <script>
          var swiper = new Swiper(".menu__swiper", {
            spaceBetween: 30,
            effect: "fade",
            pauseOnMouseEnter: true,
            loop: true,
            autoplay: {
              delay: 4500,
              disableOnInteraction: false,
            },
          });

        </script>

        <!-- Swiper Chef -->
        <script>
          var swiper = new Swiper(".swiper__restaurant-chef", {
            spaceBetween: 30,
            loop: true,
            pauseOnMouseEnter: true,
            autoplay: {
              delay: 4500,
              disableOnInteraction: false,
            },
          });
        </script>

        <!-- Swiper Instagram -->
        <script>
          var swiper = new Swiper(".instagram-swiper", {
            slidesPerView: "auto",
            spaceBetween: 32,
            freeMode: true,
          });
        </script>
    </body>
</html>
