<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gericht Contact-us page of the bar">
  <title>Gericht | Contact-Us</title>
  <link rel="stylesheet" href="./../css/normalize.css">
  <link rel="stylesheet" href="./../css/swiper-bundle.min.css">
  <link rel="stylesheet" href="./../css/main.min.css">
  <!-- Add map script -->
  <link rel="stylesheet" href="./../css/leaflet.css">
</head>
<body>
  <div class="wrapper">
    <!--= include header.html -->
      <main class="main">
        <!--= include home-contact-us-hero.html -->
        <!--= include map.html -->
        <!--= include contact-form.html -->
        <!--= include subscribe.html -->
        <!--= include scrollTop.html -->
      </main>
    <!--= include footer.html -->
  </div>
  <script src="./../js/index.bundle.js"></script>
  <script src="./../js/swiper-bundle.min.js"></script>
  <script src="./../js/leaflet.js"></script>
  <script src="./../js/form_validation.bundle.js"></script>
  <script src="./../js/scrollToTop.bundle.js"></script>

  <script>
    var swiper = new Swiper(".home-item-hero__swiper", {
      spaceBetween: 30,
      effect: "fade",
      pauseOnMouseEnter: true,
      loop: true,
      autoplay: {
        delay: 4500,
        disableOnInteraction: false,
      },
    });
  </script>

  <script>
    // Инициализация карты
    const map = L.map('map').setView([40.76127879164621, -73.97678243742837], 20); // Замените координаты на нужные (пример: USA)

    // Добавление слоя карты OpenStreetMap
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
      maxZoom: 18,
    }).addTo(map);
    // Создание пользовательской иконки
    const customIcon = L.icon({
      iconUrl: './../images/map-icon.png', // Замените на путь к вашему изображению
      iconSize: [62, 62], // Размер иконки
      iconAnchor: [31, 62], // Точка привязки (центр нижней части иконки)
      popupAnchor: [0, -45], // Точка привязки для всплывающего окна
    });
    // Добавление маркера на карту
    const marker = L.marker([40.76127879164621, -73.97678243742837], { icon: customIcon })
      .addTo(map)
    // Добавление подсказки (tooltip), которая отображается при наведении
    marker.bindTooltip("<b>Gericht Restaurant</b><br>9 W 53rd St, New York, NY 10019, USA", {
      permanent: false,    // Подсказка видна только при наведении
      direction: "top",    // Расположение подсказки относительно маркера
      className: "custom-tooltip", // Класс для кастомных стилей
    });

    // События: показываем и скрываем подсказку
    marker.on('mouseover', function () {
      this.openTooltip(); // Показываем подсказку
    });

    marker.on('mouseout', function () {
      this.closeTooltip(); // Скрываем подсказку
    });
  </script>
</body>
</html>
