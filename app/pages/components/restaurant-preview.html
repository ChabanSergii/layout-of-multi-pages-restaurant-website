<section class="preview spoon-crossing-left">
  <div class="container preview__container">
      <div class="video-player">
        <video id="video" src="../../video/test.mp4" poster="../../images/section-background-play.jpg"></video>

        <!-- Кастомные элементы управления -->
        <div class="controls">
            <button id="playPause" class="control-button">Play</button>
            <input type="range" id="progressBar" value="0" max="100">
            <span id="currentTime">00:00</span> / <span id="duration">00:00</span>
            <input type="range" id="volumeControl" min="0" max="1" step="0.1" value="1">
            <button id="fullscreen" class="control-button">Fullscreen</button>
        </div>
    </div>
  </div>
</section>
