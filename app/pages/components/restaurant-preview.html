<section class="preview spoon-crossing-top-left" id="landing__preview">
  <div class="container preview__container">
    <div class="video-player">
      <video id="video" src="../../video/test.mp4" poster="./images/section-background-play.jpg" aria-label="Video player" preload="metadata">
        <!-- Поддержка различных форматов видео -->
        <source src="../../video/test.mp4" type="video/mp4">
        <source src="../../video/test.webm" type="video/webm">
        <source src="../../video/test.ogv" type="video/ogg">
        <p>Your browser does not support the video formats available for this player.</p>
      </video>

      <!-- Центральная кнопка Play/Pause -->
      <div id="playPauseCenter" class="play-pause-center" aria-label="Play video"></div>

      <!-- Кастомные элементы управления -->
      <div class="controls">
          <input type="range" id="progressBar" value="0" max="100">

          <!-- Текущее время и общая продолжительность -->
          <span id="currentTime" aria-label="Current time">00:00</span> /
          <span id="duration" aria-label="Duration">00:00</span>

          <!-- Контроль громкости -->
          <input type="range" id="volumeControl" min="0" max="1" step="0.1" value="0.5" aria-label="Volume control">

          <!-- Полноэкранный режим -->
          <button id="fullscreen" class="control-button" aria-label="Enter fullscreen">⛶</button>
      </div>
    </div>
  </div>
</section>
